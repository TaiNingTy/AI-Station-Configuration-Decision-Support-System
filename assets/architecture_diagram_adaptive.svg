<svg class="adaptive-diagram" viewBox="0 0 1440 820" xmlns="http://www.w3.org/2000/svg" font-family="'Inter', -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <style>
    /* ===== Light (default) ===== */
    .adaptive-diagram{
      --canvas:#FCFCFD; --ink:#0F172A; --muted:#64748B; --hairline:#EEF0F4;
      --card:#FFFFFF; --card-border:#E7EAF0;
      --accent:#4F46E5; --accent-text:#4F46E5; --accent-soft:#EEF2FF; --accent-soft-border:#E0E7FF; --accent-soft2:#E0E7FF;
      --on-accent:#FFFFFF; --line:#94A3B8;
      --node-bg:#0F172A; --node-text:#FFFFFF; --node-sub:#CBD5E1; --node-line:#334155; --node-chip:#1E293B; --node-mono:#93A9F5;
      --kb-bg:#F8FAFC; --chip:#EEF1F6; --chip-text:#475569;
      --amber-bg:#FFFBEB; --amber-border:#FCD34D; --amber-strong:#D97706; --amber-text:#B45309; --amber-text2:#A16207;
      --deliver-mono:#5EEAD4; --footer-text:#475569;
    }
    /* ===== Dark via OS preference (works even as an img element) ===== */
    @media (prefers-color-scheme: dark){
      .adaptive-diagram{
        --canvas:#0D1117; --ink:#E6E8EC; --muted:#8B93A1; --hairline:#222A36;
        --card:#161C26; --card-border:#29313F;
        --accent:#818CF8; --accent-text:#A5B4FC; --accent-soft:#1E2438; --accent-soft-border:#2E3550; --accent-soft2:#27304C;
        --on-accent:#12151C; --line:#5C6675;
        --node-bg:#1B2330; --node-text:#E6E8EC; --node-sub:#9AA4B2; --node-line:#38424F; --node-chip:#2A3446; --node-mono:#A5B4FC;
        --kb-bg:#10151D; --chip:#222A36; --chip-text:#AEB7C4;
        --amber-bg:#2A2413; --amber-border:#FCD34D; --amber-strong:#FBBF24; --amber-text:#FBBF24; --amber-text2:#E0A93B;
        --deliver-mono:#5EEAD4; --footer-text:#AEB7C4;
      }
    }
    /* ===== Dark via site's manual toggle (works when INLINED) ===== */
    .dark .adaptive-diagram, [data-theme="dark"] .adaptive-diagram{
      --canvas:#0D1117; --ink:#E6E8EC; --muted:#8B93A1; --hairline:#222A36;
      --card:#161C26; --card-border:#29313F;
      --accent:#818CF8; --accent-text:#A5B4FC; --accent-soft:#1E2438; --accent-soft-border:#2E3550; --accent-soft2:#27304C;
      --on-accent:#12151C; --line:#5C6675;
      --node-bg:#1B2330; --node-text:#E6E8EC; --node-sub:#9AA4B2; --node-line:#38424F; --node-chip:#2A3446; --node-mono:#A5B4FC;
      --kb-bg:#10151D; --chip:#222A36; --chip-text:#AEB7C4;
      --amber-bg:#2A2413; --amber-border:#FCD34D; --amber-strong:#FBBF24; --amber-text:#FBBF24; --amber-text2:#E0A93B;
      --deliver-mono:#5EEAD4; --footer-text:#AEB7C4;
    }
    /* ===== Explicit light toggle wins over OS preference ===== */
    .light .adaptive-diagram, [data-theme="light"] .adaptive-diagram{
      --canvas:#FCFCFD; --ink:#0F172A; --muted:#64748B; --hairline:#EEF0F4;
      --card:#FFFFFF; --card-border:#E7EAF0;
      --accent:#4F46E5; --accent-text:#4F46E5; --accent-soft:#EEF2FF; --accent-soft-border:#E0E7FF; --accent-soft2:#E0E7FF;
      --on-accent:#FFFFFF; --line:#94A3B8;
      --node-bg:#0F172A; --node-text:#FFFFFF; --node-sub:#CBD5E1; --node-line:#334155; --node-chip:#1E293B; --node-mono:#93A9F5;
      --kb-bg:#F8FAFC; --chip:#EEF1F6; --chip-text:#475569;
      --amber-bg:#FFFBEB; --amber-border:#FCD34D; --amber-strong:#D97706; --amber-text:#B45309; --amber-text2:#A16207;
      --deliver-mono:#5EEAD4; --footer-text:#475569;
    }
  </style>
  <defs>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="14" flood-color="#0F172A" flood-opacity="0.07"/>
    </filter>
    <filter id="softsm" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="7" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="6.5" refY="4" orient="auto">
      <path d="M0.5 0.5 L7 4 L0.5 7.5" fill="none" stroke="var(--line,#94A3B8)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrowUp" markerWidth="9" markerHeight="9" refX="6.5" refY="4" orient="auto">
      <path d="M0.5 0.5 L7 4 L0.5 7.5" fill="none" stroke="var(--line,#94A3B8)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1440" height="820" fill="var(--canvas,#FCFCFD)"/>

  <!-- Header -->
  <text x="60" y="70" font-size="27" font-weight="700" fill="var(--ink,#0F172A)">AI Station Configuration &amp; Decision Support System</text>
  <text x="61" y="100" font-size="15" fill="var(--muted,#64748B)">Multi-Agent Workflow &#183; grounded generation, traceable rules, human-gated decisions</text>
  <g>
    <rect x="1196" y="48" width="184" height="34" rx="17" fill="var(--accent-soft,#EEF2FF)" stroke="var(--accent-soft-border,#E0E7FF)"/>
    <circle cx="1218" cy="65" r="4" fill="var(--accent,#4F46E5)"/>
    <text x="1231" y="70" font-size="13" font-weight="600" fill="var(--accent-text,#4F46E5)">Built on Coze &#183; RAG</text>
  </g>
  <line x1="60" y1="128" x2="1380" y2="128" stroke="var(--hairline,#EEF0F4)" stroke-width="1"/>

  <line x1="226" y1="330" x2="1206" y2="330" stroke="var(--hairline,#E9ECF2)" stroke-width="2" stroke-dasharray="1 7" stroke-linecap="round"/>

  <!-- INPUT -->
  <g filter="url(#softsm)"><rect x="44" y="234" width="182" height="192" rx="16" fill="var(--node-bg,#0F172A)"/></g>
  <text x="70" y="272" font-size="15" font-weight="700" fill="var(--node-text,#FFFFFF)">Site Input</text>
  <line x1="70" y1="286" x2="200" y2="286" stroke="var(--node-line,#334155)" stroke-width="1"/>
  <text x="70" y="312" font-size="12.5" fill="var(--node-sub,#CBD5E1)">Location &amp; land size</text>
  <text x="70" y="334" font-size="12.5" fill="var(--node-sub,#CBD5E1)">Peak passenger flow</text>
  <text x="70" y="356" font-size="12.5" fill="var(--node-sub,#CBD5E1)">Site constraints</text>
  <text x="70" y="378" font-size="12.5" fill="var(--node-sub,#CBD5E1)">Owner requirements</text>
  <g><rect x="70" y="392" width="90" height="22" rx="11" fill="var(--node-chip,#1E293B)"/><text x="82" y="407" font-size="11" fill="var(--node-mono,#93A9F5)" font-family="'SF Mono','Roboto Mono',monospace">site_info</text></g>

  <line x1="230" y1="330" x2="282" y2="330" stroke="var(--line,#94A3B8)" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- AGENT 1 -->
  <g filter="url(#soft)"><rect x="286" y="234" width="232" height="192" rx="16" fill="var(--card,#FFFFFF)" stroke="var(--card-border,#E7EAF0)"/></g>
  <circle cx="316" cy="272" r="16" fill="var(--accent,#4F46E5)"/>
  <text x="316" y="277" font-size="15" font-weight="700" fill="var(--on-accent,#FFFFFF)" text-anchor="middle">1</text>
  <text x="342" y="270" font-size="16" font-weight="700" fill="var(--ink,#0F172A)">Requirement</text>
  <text x="342" y="291" font-size="16" font-weight="700" fill="var(--ink,#0F172A)">Analysis</text>
  <text x="310" y="332" font-size="12.5" fill="var(--muted,#64748B)">Parses raw site info and</text>
  <text x="310" y="352" font-size="12.5" fill="var(--muted,#64748B)">classifies station grade</text>
  <text x="310" y="372" font-size="12.5" fill="var(--muted,#64748B)">(S / A / B / C).</text>
  <line x1="310" y1="388" x2="494" y2="388" stroke="var(--hairline,#EEF0F4)" stroke-width="1"/>
  <g><rect x="310" y="398" width="132" height="22" rx="11" fill="var(--accent-soft,#EEF2FF)"/><text x="322" y="413" font-size="11" fill="var(--accent-text,#4F46E5)" font-family="'SF Mono','Roboto Mono',monospace">requirement.json</text></g>

  <line x1="518" y1="330" x2="574" y2="330" stroke="var(--line,#94A3B8)" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- AGENT 2 -->
  <g filter="url(#soft)"><rect x="578" y="234" width="232" height="192" rx="16" fill="var(--card,#FFFFFF)" stroke="var(--card-border,#E7EAF0)"/></g>
  <circle cx="608" cy="272" r="16" fill="var(--accent,#4F46E5)"/>
  <text x="608" y="277" font-size="15" font-weight="700" fill="var(--on-accent,#FFFFFF)" text-anchor="middle">2</text>
  <text x="634" y="270" font-size="16" font-weight="700" fill="var(--ink,#0F172A)">Retrieval +</text>
  <text x="634" y="291" font-size="16" font-weight="700" fill="var(--ink,#0F172A)">Rule Evaluation</text>
  <text x="602" y="332" font-size="12.5" fill="var(--muted,#64748B)">Grounds on knowledge</text>
  <text x="602" y="352" font-size="12.5" fill="var(--muted,#64748B)">base; checks compliance</text>
  <text x="602" y="372" font-size="12.5" fill="var(--muted,#64748B)">&amp; flags risks.</text>
  <line x1="602" y1="388" x2="786" y2="388" stroke="var(--hairline,#EEF0F4)" stroke-width="1"/>
  <g><rect x="602" y="398" width="126" height="22" rx="11" fill="var(--accent-soft,#EEF2FF)"/><text x="614" y="413" font-size="11" fill="var(--accent-text,#4F46E5)" font-family="'SF Mono','Roboto Mono',monospace">evaluation.json</text></g>

  <line x1="694" y1="548" x2="694" y2="430" stroke="var(--line,#94A3B8)" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrowUp)"/>

  <!-- Knowledge Base -->
  <g filter="url(#softsm)"><rect x="560" y="550" width="268" height="128" rx="16" fill="var(--kb-bg,#F8FAFC)" stroke="var(--card-border,#E7EAF0)"/></g>
  <g transform="translate(584,574)">
    <rect x="0" y="0" width="26" height="26" rx="6" fill="var(--accent-soft2,#E0E7FF)"/>
    <path d="M6 6 h10 a2 2 0 0 1 2 2 v12 h-14 v-14 z M6 6 v14" fill="none" stroke="var(--accent,#4F46E5)" stroke-width="1.6" stroke-linejoin="round"/>
  </g>
  <text x="620" y="584" font-size="14.5" font-weight="700" fill="var(--ink,#0F172A)">Knowledge Base</text>
  <text x="620" y="602" font-size="11.5" fill="var(--muted,#94A3B8)">Retrieval-augmented grounding</text>
  <g font-size="11" font-weight="600" fill="var(--chip-text,#475569)">
    <g><rect x="584" y="618" width="86" height="24" rx="12" fill="var(--chip,#EEF1F6)"/><text x="600" y="634">Planning</text></g>
    <g><rect x="676" y="618" width="110" height="24" rx="12" fill="var(--chip,#EEF1F6)"/><text x="692" y="634">Engineering</text></g>
    <g><rect x="584" y="648" width="70" height="24" rx="12" fill="var(--chip,#EEF1F6)"/><text x="600" y="664">Rules</text></g>
    <g><rect x="660" y="648" width="126" height="24" rx="12" fill="var(--chip,#EEF1F6)"/><text x="676" y="664">Historical Cases</text></g>
  </g>

  <line x1="810" y1="330" x2="838" y2="330" stroke="var(--line,#94A3B8)" stroke-width="1.6"/>

  <!-- Human-in-the-loop gate -->
  <g filter="url(#softsm)"><circle cx="866" cy="330" r="26" fill="var(--amber-bg,#FFFBEB)" stroke="var(--amber-border,#FCD34D)" stroke-width="1.5"/></g>
  <g transform="translate(866,330)" stroke="var(--amber-strong,#D97706)" stroke-width="1.7" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="0" cy="-5" r="4.2"/>
    <path d="M-7 9 c0 -6 3.2 -9 7 -9 c3.8 0 7 3 7 9"/>
  </g>
  <text x="866" y="386" font-size="12" font-weight="700" fill="var(--amber-text,#B45309)" text-anchor="middle">Human-in-the-loop</text>
  <text x="866" y="403" font-size="10.5" fill="var(--amber-text2,#A16207)" text-anchor="middle">feasibility &amp; sign-off</text>

  <line x1="894" y1="330" x2="922" y2="330" stroke="var(--line,#94A3B8)" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- AGENT 3 -->
  <g filter="url(#soft)"><rect x="926" y="234" width="232" height="192" rx="16" fill="var(--card,#FFFFFF)" stroke="var(--card-border,#E7EAF0)"/></g>
  <circle cx="956" cy="272" r="16" fill="var(--accent,#4F46E5)"/>
  <text x="956" y="277" font-size="15" font-weight="700" fill="var(--on-accent,#FFFFFF)" text-anchor="middle">3</text>
  <text x="982" y="270" font-size="16" font-weight="700" fill="var(--ink,#0F172A)">Configuration +</text>
  <text x="982" y="291" font-size="16" font-weight="700" fill="var(--ink,#0F172A)">Documentation</text>
  <text x="950" y="332" font-size="12.5" fill="var(--muted,#64748B)">Recommends config with</text>
  <text x="950" y="352" font-size="12.5" fill="var(--muted,#64748B)">rationale &amp; confidence;</text>
  <text x="950" y="372" font-size="12.5" fill="var(--muted,#64748B)">generates delivery doc.</text>
  <line x1="950" y1="388" x2="1134" y2="388" stroke="var(--hairline,#EEF0F4)" stroke-width="1"/>
  <g><rect x="950" y="398" width="104" height="22" rx="11" fill="var(--accent-soft,#EEF2FF)"/><text x="962" y="413" font-size="11" fill="var(--accent-text,#4F46E5)" font-family="'SF Mono','Roboto Mono',monospace">proposal.md</text></g>

  <line x1="1158" y1="330" x2="1210" y2="330" stroke="var(--line,#94A3B8)" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- DELIVERABLE -->
  <g filter="url(#softsm)"><rect x="1214" y="234" width="182" height="192" rx="16" fill="var(--node-bg,#0F172A)"/></g>
  <text x="1240" y="272" font-size="15" font-weight="700" fill="var(--node-text,#FFFFFF)">Delivery Package</text>
  <line x1="1240" y1="286" x2="1370" y2="286" stroke="var(--node-line,#334155)" stroke-width="1"/>
  <text x="1240" y="312" font-size="12.5" fill="var(--node-sub,#CBD5E1)">Configuration table</text>
  <text x="1240" y="334" font-size="12.5" fill="var(--node-sub,#CBD5E1)">Risk &amp; HITL flags</text>
  <text x="1240" y="356" font-size="12.5" fill="var(--node-sub,#CBD5E1)">Delivery checklist</text>
  <text x="1240" y="378" font-size="12.5" fill="var(--node-sub,#CBD5E1)">Design rationale</text>
  <g><rect x="1240" y="392" width="132" height="22" rx="11" fill="var(--node-chip,#1E293B)"/><text x="1252" y="407" font-size="11" fill="var(--deliver-mono,#5EEAD4)" font-family="'SF Mono','Roboto Mono',monospace">ready for review</text></g>

  <!-- Stage labels -->
  <g font-size="11" font-weight="600" fill="var(--muted,#94A3B8)" letter-spacing="0.5">
    <text x="135" y="460" text-anchor="middle">INPUT</text>
    <text x="402" y="460" text-anchor="middle">ANALYZE</text>
    <text x="694" y="460" text-anchor="middle">GROUND &amp; VALIDATE</text>
    <text x="1042" y="460" text-anchor="middle">SYNTHESIZE</text>
    <text x="1305" y="460" text-anchor="middle">DELIVER</text>
  </g>

  <!-- Footer -->
  <line x1="60" y1="726" x2="1380" y2="726" stroke="var(--hairline,#EEF0F4)" stroke-width="1"/>
  <g font-size="12.5" font-weight="600">
    <g><circle cx="70" cy="762" r="4" fill="var(--accent,#4F46E5)"/><text x="84" y="767" fill="var(--footer-text,#475569)">Knowledge grounded &#8212; no fabricated specs</text></g>
    <g><circle cx="470" cy="762" r="4" fill="var(--accent,#4F46E5)"/><text x="484" y="767" fill="var(--footer-text,#475569)">Traceable to source rules (KB-cited)</text></g>
    <g><circle cx="850" cy="762" r="4" fill="var(--amber-strong,#D97706)"/><text x="864" y="767" fill="var(--footer-text,#475569)">Hard-constraint conflicts routed to humans</text></g>
  </g>
</svg>
